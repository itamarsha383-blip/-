<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1920px; overflow:hidden; }
  body { font-family:"Helvetica Neue", Arial, "Liberation Sans", sans-serif;
    background:radial-gradient(120% 70% at 50% 15%, #16161f 0%, #0a0a0f 55%, #060609 100%);
    color:#fff; display:flex; flex-direction:column; align-items:center; }
  .live { display:flex; align-items:center; gap:14px; margin-top:110px; font-size:30px; letter-spacing:6px; color:#9aa0aa; font-weight:600;
    opacity:0; animation:fin .5s ease-out .2s forwards; }
  .live .g { width:14px; height:14px; border-radius:50%; background:#38e08a; box-shadow:0 0 18px #38e08a; animation:glow 1.4s ease-in-out infinite; }
  @keyframes glow { 50%{ box-shadow:0 0 34px #38e08a; } }
  @keyframes fin { to{ opacity:1;} }
  @keyframes finup { to{ opacity:1; transform:translateY(0);} }
  .logo { margin-top:64px; display:flex; align-items:center; gap:28px; opacity:0; transform:translateY(30px); animation:finup .6s ease-out .5s forwards; }
  .logo .mark { width:130px; height:130px; border-radius:32px; border:3px solid rgba(160,140,255,.6);
    display:flex; align-items:center; justify-content:center; font-size:78px; font-weight:800; background:#0b0b12; }
  .logo .mark span { background:linear-gradient(135deg,#8fb6ff,#c79bff,#ff9ed6); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .logo .name { font-size:96px; font-weight:800; }
  .logo .name .ai { background:linear-gradient(135deg,#8fb6ff,#ff9ed6); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .tag { margin-top:40px; font-size:52px; font-weight:600; color:#c9ccd3; opacity:0; animation:fin .5s ease-out .9s forwards; }
  .price { margin-top:70px; display:flex; align-items:flex-end; gap:16px; opacity:0; transform:scale(.7); animation:pscale .6s cubic-bezier(.2,1.3,.4,1) 1.1s forwards; }
  @keyframes pscale { to{ opacity:1; transform:scale(1);} }
  .price .amt { font-size:170px; font-weight:800; line-height:.9; }
  .price .per { font-size:52px; color:#9aa0aa; margin-bottom:26px; }
  .perday { margin-top:20px; font-size:46px; font-weight:700; background:linear-gradient(135deg,#8fb6ff,#ff9ed6);
    -webkit-background-clip:text; background-clip:text; color:transparent; opacity:0; animation:fin .5s ease-out 1.5s forwards; }
  .feats { margin-top:60px; display:flex; flex-direction:column; gap:34px; width:100%; padding:0 130px; }
  .feat { display:flex; align-items:center; gap:30px; font-size:48px; opacity:0; transform:translateX(-40px); }
  .feat .ck { width:56px; height:56px; border-radius:50%; flex:none; background:rgba(56,224,138,.15);
    border:2px solid #38e08a; color:#38e08a; display:flex; align-items:center; justify-content:center; font-size:34px; font-weight:800; }
  @keyframes fslide { to{ opacity:1; transform:translateX(0);} }
  .f1 { animation:fslide .5s cubic-bezier(.2,.8,.2,1) 1.9s forwards; }
  .f2 { animation:fslide .5s cubic-bezier(.2,.8,.2,1) 2.3s forwards; }
  .f3 { animation:fslide .5s cubic-bezier(.2,.8,.2,1) 2.7s forwards; }
  .cta { margin-top:auto; margin-bottom:70px; width:100%; padding:0 90px; opacity:0; transform:translateY(30px); animation:finup .6s ease-out 3.2s forwards; }
  .btn { width:100%; padding:48px; border-radius:70px; text-align:center; font-size:60px; font-weight:800; color:#0a0a0c;
    background:linear-gradient(135deg,#9fc0ff,#c79bff,#ff9ed6); box-shadow:0 20px 70px rgba(150,120,255,.4);
    animation:ctap 1.6s ease-in-out 3.8s infinite; }
  @keyframes ctap { 50%{ transform:scale(1.03); box-shadow:0 24px 90px rgba(180,140,255,.7);} }
  .url { text-align:center; margin-top:36px; font-size:46px; color:#fff; font-weight:700; }
  .url b { background:linear-gradient(135deg,#8fb6ff,#ff9ed6); -webkit-background-clip:text; background-clip:text; color:transparent; }
</style></head><body>
  <div class="live"><span class="g"></span> SYSTEM LIVE · 24/7</div>
  <div class="logo"><div class="mark"><span>N</span></div><div class="name">Novixel<span class="ai">.ai</span></div></div>
  <div class="tag">Your 24/7 AI receptionist</div>
  <div class="price"><span class="amt">$197</span><span class="per">/month</span></div>
  <div class="perday">≈ $7 / day · cancel anytime</div>
  <div class="feats">
    <div class="feat f1"><span class="ck">✓</span> Answers every call, chat &amp; text</div>
    <div class="feat f2"><span class="ck">✓</span> Books straight to your calendar</div>
    <div class="feat f3"><span class="ck">✓</span> Never sleeps. Never misses a lead.</div>
  </div>
  <div class="cta"><div class="btn">Call Novi now →</div><div class="url">See it live → <b>novixelai.com</b></div></div>
</body></html>
