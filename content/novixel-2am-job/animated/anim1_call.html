<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1920px; overflow:hidden; }
  body { font-family:"Helvetica Neue", Arial, "Liberation Sans", sans-serif;
    background:radial-gradient(120% 80% at 50% 0%, #14141b 0%, #08080b 55%, #050507 100%);
    color:#fff; position:relative; }
  .status { display:flex; justify-content:space-between; align-items:center;
    padding:34px 60px 0; font-size:34px; font-weight:600; letter-spacing:.5px; }
  .status .dots { font-size:30px; }
  .wrap { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; }
  .live { display:flex; align-items:center; gap:14px; margin-top:60px;
    font-size:26px; letter-spacing:6px; color:#9aa0aa; font-weight:600; }
  .live .g { width:14px; height:14px; border-radius:50%; background:#38e08a;
    box-shadow:0 0 18px #38e08a; animation:glow 1.4s ease-in-out infinite; }
  @keyframes glow { 50%{ box-shadow:0 0 34px #38e08a; } }
  .label { margin-top:26px; font-size:40px; color:#8890a0; letter-spacing:3px; text-transform:uppercase; }
  .avatar { margin-top:60px; width:280px; height:280px; border-radius:50%;
    background:#0e0e15; border:3px solid rgba(255,255,255,.22);
    display:flex; align-items:center; justify-content:center; position:relative;
    animation:ring 2s ease-in-out infinite; }
  @keyframes ring { 0%,100%{ box-shadow:0 0 50px rgba(255,255,255,.12); }
    50%{ box-shadow:0 0 90px rgba(255,255,255,.28); } }
  .avatar img.mk { position:relative; z-index:2; width:46%; }
  .caller { margin-top:70px; font-size:96px; font-weight:800; }
  .sub { margin-top:20px; font-size:44px; color:#9aa0aa; }
  .answering { margin-top:64px; display:flex; align-items:center; gap:22px;
    background:rgba(140,120,255,.12); border:2px solid rgba(160,140,255,.35);
    padding:26px 52px; border-radius:60px; }
  .bars { display:flex; gap:8px; align-items:center; height:56px; }
  .bars i { width:9px; border-radius:5px; background:linear-gradient(#8fb6ff,#ff9ed6);
    height:18px; animation:wave 0.9s ease-in-out infinite; }
  .bars i:nth-child(1){animation-delay:0s} .bars i:nth-child(2){animation-delay:.1s}
  .bars i:nth-child(3){animation-delay:.2s} .bars i:nth-child(4){animation-delay:.3s}
  .bars i:nth-child(5){animation-delay:.15s} .bars i:nth-child(6){animation-delay:.25s}
  @keyframes wave { 0%,100%{height:16px} 50%{height:52px} }
  .answering span { font-size:44px; font-weight:700; }
  .actions { position:absolute; bottom:210px; left:0; right:0; display:flex; justify-content:center; gap:180px; }
  .btn { width:150px; height:150px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:70px; }
  .decline { background:#ff3b30; transform:rotate(135deg); }
  .accept { background:#34c759; box-shadow:0 0 50px rgba(52,199,89,.5); animation:pulse 1.3s ease-in-out infinite; }
  @keyframes pulse { 50%{ transform:scale(1.08); box-shadow:0 0 80px rgba(52,199,89,.8); } }
  .brand { position:absolute; bottom:80px; left:0; right:0; text-align:center;
    font-size:34px; letter-spacing:3px; color:#6b7280; font-weight:600; }
  .brand b { color:#fff; font-weight:800; }
</style></head><body>
  <div class="status"><div>2:14 AM</div><div class="dots">📶 &nbsp; 🔋</div></div>
  <div class="wrap">
    <div class="live"><span class="g"></span> SYSTEM LIVE</div>
    <div class="label">Incoming call</div>
    <div class="avatar"><img class="mk" src="brand/logo_mark.png"></div>
    <div class="caller">New Lead</div>
    <div class="sub">mobile • Unknown</div>
    <div class="answering">
      <div class="bars"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <span>Novi is answering…</span>
    </div>
    <div class="actions"><div class="btn decline">📞</div><div class="btn accept">📞</div></div>
    <div class="brand"><b>NovixelAI</b> &nbsp;•&nbsp; 24/7 AI Receptionist</div>
  </div>
</body></html>
