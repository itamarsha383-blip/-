<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1920px; overflow:hidden; }
  body { font-family:"Helvetica Neue", Arial, "Liberation Sans", sans-serif;
    background:radial-gradient(130% 80% at 50% 45%, #101017 0%, #08080c 55%, #040406 100%);
    color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .logo { opacity:0; transform:translateY(24px) scale(.98);
    animation:rise 1.1s cubic-bezier(.2,.8,.2,1) .3s forwards; }
  .logo img { width:660px; height:auto; display:block; }
  .line { margin-top:54px; font-size:52px; font-weight:400; color:#c9ccd3; letter-spacing:.5px;
    opacity:0; animation:fade 1.2s ease-out 1.3s forwards; }
  .url { margin-top:70px; font-size:44px; letter-spacing:3px; color:#8890a0; font-weight:600;
    opacity:0; animation:fade 1.2s ease-out 2.2s forwards; }
  @keyframes rise { to{ opacity:1; transform:translateY(0) scale(1);} }
  @keyframes fade { to{ opacity:1;} }
  .glow { position:absolute; width:700px; height:700px; border-radius:50%;
    background:radial-gradient(circle, rgba(140,120,255,.14), transparent 70%);
    filter:blur(20px); opacity:0; animation:fade 2s ease-out .3s forwards; }
</style></head><body>
  <div class="glow"></div>
  <div class="logo"><img src="brand/logo_full.png"></div>
  <div class="line">never miss another call.</div>
  <div class="url">novixelai.com</div>
</body></html>
